name: "rein review"
description: "Run rein over a path and upload findings as SARIF for code scanning."

inputs:
  path:
    description: "File or directory to review."
    required: false
    default: "src/"
  output:
    description: "Path to write the SARIF report to."
    required: false
    default: "rein.sarif"
  upload:
    description: >-
      Upload the SARIF to GitHub code scanning (Security tab). Set to "false"
      to only produce the SARIF file as an artifact - useful where code scanning
      is unavailable (private repos without GitHub Advanced Security).
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install rein
      shell: bash
      # Install from the action's own checkout, not the caller's workspace, so
      # external callers get rein installed rather than their own repo.
      run: pip install "${{ github.action_path }}"

    - name: Run rein review
      shell: bash
      # A BLOCK verdict exits non-zero; continue so the SARIF still uploads.
      continue-on-error: true
      run: rein review "${{ inputs.path }}" --format sarif > "${{ inputs.output }}"

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      # always() so a BLOCK verdict still uploads; gated on the upload input so
      # callers without code scanning can run review-only (SARIF as an artifact).
      if: ${{ always() && inputs.upload == 'true' }}
      with:
        sarif_file: ${{ inputs.output }}
