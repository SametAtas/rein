name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest -q
      - run: rein review src/
      - run: rein commit-check

  action:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload-sarif writes to the Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the GitHub Action
        uses: ./
        with:
          path: src/
